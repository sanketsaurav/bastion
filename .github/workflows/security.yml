name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
